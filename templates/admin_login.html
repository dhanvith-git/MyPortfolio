
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Dhanvith Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #071426;
            font-family: Arial, sans-serif;
            color: white;
        }

        .login-box {
            width: 320px;
            padding: 35px;
            background: #10243d;
            border: 1px solid #287bca;
            border-radius: 15px;
            text-align: center;
        }

        .login-box h2 {
            color: #45c8ff;
            margin-bottom: 25px;
        }

        .login-box input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #45617e;
            border-radius: 7px;
            background: #071426;
            color: white;
        }

        .login-box button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 7px;
            background: #20b9ed;
            color: #071426;
            font-weight: bold;
            cursor: pointer;
        }

        .login-box a {
            display: block;
            margin-top: 20px;
            color: #45c8ff;
            text-decoration: none;
        }

        .message {
            color: #ff9999;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Admin Login</h2>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username"
                   placeholder="Enter Username" required>

            <input type="password" name="password"
                   placeholder="Enter Password" required>

            <button type="submit">Login</button>
        </form>

        <a href="{{ url_for('home') }}">Back to Portfolio</a>
    </div>

</body>
</html>
